name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            go test -race -coverprofile=coverage.out ./...
          else
            go test ./...
          fi
        shell: bash
      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  # The Postgres backend is the production recommendation, but its tests skip
  # silently without HOOKAIDO_TEST_POSTGRES_DSN -- including the cross-backend
  # queue.Store contract tests, which are the ones that establish parity with
  # sqlite and memory. Without this job they only ever ran against those two
  # here, which is how several Postgres-only divergences reached main (#207).
  #
  # Service containers are Linux-only, so this cannot be folded into the
  # matrixed `test` job that also covers Windows.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hookaido
          POSTGRES_PASSWORD: hookaido
          POSTGRES_DB: hookaido
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookaido"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      # -p 1 matters: the packages below share one database, so running their
      # tests in parallel makes them race on the same tables. This is what
      # `make test-pg` does.
      - name: Test (Postgres backend)
        env:
          HOOKAIDO_TEST_POSTGRES_DSN: postgres://hookaido:hookaido@127.0.0.1:5432/hookaido?sslmode=disable
        run: go test -race -p 1 ./internal/queue/ ./internal/secrets/ ./modules/postgres/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

  # The container image was only ever built by the tag-triggered container
  # workflow, so nothing checked it on a pull request. That is how the go.mod
  # bump to 1.26.6 could land while the Dockerfile still pinned a builder image
  # shipping 1.26.5: `go mod download` failed under GOTOOLCHAIN=local, and it
  # surfaced for the first time when v2.10.0 was tagged -- after the GitHub
  # Release had already published. Building here fails the PR instead.
  #
  # Build only, never push: publishing stays tag-driven in container.yml. One
  # platform is enough, since what this guards against (toolchain drift, a
  # broken Dockerfile, a missing file) is architecture-independent, and a
  # multi-arch build under QEMU would cost minutes per PR for no added signal.
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build Image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: hookaido:ci
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
      # Building is not enough: a CRLF shebang or a missing file produces an
      # image that builds and then cannot start.
      - name: Smoke Test Image
        run: docker run --rm hookaido:ci version --long

  release-package-dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Generate Ephemeral Signing Key
        run: openssl genpkey -algorithm ED25519 -out ci-release-signing-key.pem
      - name: Build Release Archives
        run: go run ./internal/tools/release -version "0.0.0-ci" -commit "${GITHUB_SHA::12}" -out dist -signing-key ci-release-signing-key.pem
      - name: Verify Checksums File
        run: test -f dist/hookaido_0.0.0-ci_checksums.txt
      - name: Verify Signed Checksums + Manifest
        run: |
          test -f dist/hookaido_0.0.0-ci_checksums.txt.sig
          test -f dist/hookaido_0.0.0-ci_checksums.txt.pub.pem
          test -f dist/hookaido_0.0.0-ci_manifest.json
          test -f dist/hookaido_0.0.0-ci_sbom.spdx.json
      - name: Verify Release Artifacts (hookaido verify-release)
        run: go run ./cmd/hookaido verify-release --checksums dist/hookaido_0.0.0-ci_checksums.txt --require-signature --require-sbom
